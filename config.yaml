# Réglages de Field Scan. Toute valeur absente garde sa valeur par défaut (fieldscan/config.py).
entrees:
  drone_resolution_max_m: 0.5
nuages:
  seuil_masque_pct: 50.0
maladies:
  # Module à deux branches (docs/protocole_maladies_cinq_classes.md, sections 4 et 6 ; docs/protocole_maladies_deux_branches.md).
  # Branche « proche » (gros plans) : v10b du binôme (3 ConvNeXt-Tiny aux poids DINOv3, lus en 384 px, 4 vues, 4 classes
  # dont « autre », règle B et règle de sa v11, seuils dans seuils.json). Intégrée par décision de Corentin le 11/11 ;
  # garde-fou et mesures : docs/protocole_maladies_v10b.md. Poids hors du dépôt (166 Mo).
  modele: modeles/maladies_binome/v10b
  # Ancienne branche « proche » : soupe v2 + v8 (modele: modeles/maladies_soupe_v2_v8/poids ; température proche 0.61).
  # Branche « loin » (plantes entières) : v2 du binôme, réponse suivie de « à confirmer par un gros plan ».
  modele_loin: modeles/maladies_binome/maladies_v2/poids
  # Aiguilleur loin / près : DINOv2 ViT-B/14 figé + régression logistique (scripts/ajuster_aiguilleur.py). Sans cette
  # ligne, une seule branche (« modele »).
  aiguilleur: modeles/maladies_aiguilleur/aiguilleur.npz
  # Branche « proche » : « je ne sais pas » avec P(malade) >= seuil d'alerte -> « malade, non identifiée » (alerte).
  # Adopté par l'amendement 2 du protocole « cinq classes » : en validation, malades sans alerte 112 -> 9 / 2 001,
  # saines en alerte 9 -> 15 / 1 000.
  jnsp_alerte: true
  # Même règle pour la branche « loin » (amendement 3, décidé sur les photos du robot de dev_loin) : malades sans alerte
  # 418 -> 39 / 874, mais saines en alerte 98 -> 345 / 438. De loin, le doute devient « à confirmer par un gros plan »
  # (alerte de confiance faible dans le bulletin). Mettre false pour revenir à la règle de la v2.
  jnsp_alerte_loin: true
  # Températures des probabilités affichées, réglées sur la validation (scripts/regler_temperature.py) ; décisions inchangées.
  temperature:
    proche: 0.79   # v10b (scripts/regler_temperature.py sur out/maladies/v10b/predictions_v10b_validation.csv)
    loin: 0.59
  # Ancienne branche unique : v2 du binôme (modele: modeles/maladies_binome/maladies_v2/poids, sans aiguilleur).
  # Ancien classifieur EfficientNet-B0 (ONNX, dans le dépôt) :
  # modele: modeles/maladies/maladies_v2.onnx
  seuil_rejet: 0.7076      # B0 seulement : probabilité maximale, 95 % des feuilles connues de la validation acceptées
comptage:
  modele: modeles/centres_5cm_v4.onnx   # détecteur de centres v4 (adopté par la règle du protocole docs/protocole_comptage_v4.md) ; seuil (0,40) et résolution lus dans centres_5cm_v4.json
  coefficient_bas: 0.82    # plus petit rapport réel / détecté en validation : MM1-MM2 mères seules (69 / 84)
  coefficient_haut: 1.02   # plus grand : plantas_platano 100_metros (2633 / 2569) ; jeunes bananiers dji_0544 : 118 / 134 (scripts/mesurer_fourchette_v3.py)
  # Test (une fois) : rappel 0,45 en plantation dense, 0,59 en plantation espacée, 0,25 en agroforesterie (CG) :
  # ces situations sont sous-comptées au-delà de la fourchette
  # Détecteur de centres v3 (comparaison) : modele: modeles/centres_5cm_v3.onnx, coefficients 0.85 et 0.95
  # Détecteur de centres v2 (comparaison) : modele: modeles/centres_5cm_v2.onnx, coefficients 0.80 et 1.33
  # Détecteur de centres v1 (comparaison) : modele: modeles/centres_5cm.onnx, coefficients 0.93 et 1.21
  # Ancien détecteur à boîtes (comparaison) : modele: modeles/bananiers_deepforest_dense_v2.ckpt, seuil_score: 0.5, resolution_cm: 8
