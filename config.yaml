# Réglages de Field Scan. Toute valeur absente garde sa valeur par défaut (fieldscan/config.py).
entrees:
  drone_resolution_max_m: 0.5
nuages:
  seuil_masque_pct: 50.0
vigueur:
  # Choix de Corentin du 16/11/2026 (« Oui, comme TT1 ») : les zones faibles de vigueur (drone ou satellite) restent toutes
  # affichées, mais ne pénalisent le score d'une parcelle que si elles totalisent au moins cette surface. Motif : sur
  # l'orthophoto de Basse-Pointe, des zones de quelques m² (trous, pistes, ombres) mettaient presque toutes les parcelles
  # en orange. Les « parcelles faibles » (parcelle entière moins verte) gardent leur pénalité. 0 = règle d'avant.
  surface_min_penalite_ha: 0.5
temporel:
  # TT1, adopté par Corentin le 15/11/2026 (docs/journee_2026-11-15/recap.md, section 3) : zones de dégradation
  # (pixel comparé à sa parcelle) à la place des alertes de parcelle. Banc d'anomalies injectées, Côte d'Ivoire lue une
  # fois : 52 % des zones retrouvées contre 12,5 %, 0,39 ha en alerte sans anomalie contre 6,0 ha. Aucune référence de
  # terrain. « site » = TT2 ; null = module d'avant.
  zones_temporel: parcelle
  # Le score d'une parcelle n'est pénalisé que si ses zones de dégradation totalisent au moins cette surface (choix de
  # Corentin du 15/11, fait après avoir vu les zones d'Équateur : 0,05 à 0,49 ha). Les zones restent toutes affichées.
  surface_min_penalite_ha: 0.5
maladies:
  # Module à deux branches (docs/protocole_maladies_cinq_classes.md, sections 4 et 6 ; docs/protocole_maladies_deux_branches.md).
  # Branche « proche » (gros plans) : v10b du binôme (3 ConvNeXt-Tiny aux poids DINOv3, lus en 384 px, 4 vues, 4 classes
  # dont « autre », règle B et règle de sa v11, seuils dans seuils.json). Intégrée par décision de Corentin le 11/11 ;
  # garde-fou et mesures : docs/protocole_maladies_v10b.md. Poids hors du dépôt (166 Mo).
  modele: modeles/maladies_binome/v10b
  # Ancienne branche « proche » : soupe v2 + v8 (modele: modeles/maladies_soupe_v2_v8/poids ; température proche 0.61).
  # Branche « loin » (plantes entières) : v2 du binôme, réponse suivie de « à confirmer par un gros plan ».
  modele_loin: modeles/maladies_binome/maladies_v2/poids
  # Aiguilleur loin / près : DINOv2 ViT-B/14 figé + régression logistique (scripts/ajuster_aiguilleur.py). Sans cette
  # ligne, une seule branche (« modele »).
  aiguilleur: modeles/maladies_aiguilleur/aiguilleur.npz
  # F1 « trois morceaux 2 x 2 », adopté par Corentin le 13/11/2026 (docs/nuit_2026-11-12/recap.md, section 2) : lecteur
  # proche = moyenne géométrique à poids égaux de la v10b (« modele », lue entière et en 4 morceaux), de la soupe v2 + v8
  # et de la v2 ; seuils de la v10b sauf la confiance (0,70). Photo « loin » : réponse de la v2 si elle alerte, sinon
  # celle du lecteur proche. Juges : BanSpot 4 / 646 malades sans alerte, 56 / 646 saines en alerte ; Cordana du Pérou
  # 99,4 %. Environ 10 s de plus par photo (morceaux). Pour revenir à la chaîne du 11/11 : commenter ces quatre lignes.
  # Option plus simple, non jugée : F3 = morceaux_2x2: false et seuil_confiance_melange: 0.74.
  melange_proche: [modeles/maladies_soupe_v2_v8/poids, modeles/maladies_binome/maladies_v2/poids]
  seuil_confiance_melange: 0.70
  loin_ou_proche: true
  morceaux_2x2: true
  # F1_bornes, adopté par Corentin le 15/11/2026 (docs/nuit_2026-11-13/recap.md) : chaque lecteur n'est lu que si la
  # décision d'alerte en dépend. Mêmes alertes que F1 (juges : BanSpot 4 et 56 / 646, Cordana 99,4 %), environ deux fois
  # moins de calcul ; le nom de la maladie peut différer sur quelques photos. false = lecture complète de F1.
  morceaux_bornes: true
  # Branche « proche » : « je ne sais pas » avec P(malade) >= seuil d'alerte -> « malade, non identifiée » (alerte).
  # Adopté par l'amendement 2 du protocole « cinq classes » : en validation, malades sans alerte 112 -> 9 / 2 001,
  # saines en alerte 9 -> 15 / 1 000.
  jnsp_alerte: true
  # Même règle pour la branche « loin » (amendement 3, décidé sur les photos du robot de dev_loin) : malades sans alerte
  # 418 -> 39 / 874, mais saines en alerte 98 -> 345 / 438. De loin, le doute devient « à confirmer par un gros plan »
  # (alerte de confiance faible dans le bulletin). Mettre false pour revenir à la règle de la v2.
  jnsp_alerte_loin: true
  # Températures des probabilités affichées, réglées sur la validation (scripts/regler_temperature.py) ; décisions inchangées.
  temperature:
    proche: 0.79   # v10b (scripts/regler_temperature.py sur out/maladies/v10b/predictions_v10b_validation.csv)
    loin: 0.59
  # Ancienne branche unique : v2 du binôme (modele: modeles/maladies_binome/maladies_v2/poids, sans aiguilleur).
  # Ancien classifieur EfficientNet-B0 (ONNX, dans le dépôt) :
  # modele: modeles/maladies/maladies_v2.onnx
  seuil_rejet: 0.7076      # B0 seulement : probabilité maximale, 95 % des feuilles connues de la validation acceptées
comptage:
  modele: modeles/centres_5cm_v5.onnx   # détecteur de centres v5 (adopté par la règle du protocole docs/protocole_comptage_v5.md) ; seuil (0,30) et résolution lus dans centres_5cm_v5.json
  coefficient_bas: 0.78    # plus petit rapport réel / détecté en validation : MM1-MM2 mères seules (69 / 89)
  coefficient_haut: 0.93   # plus grand : banavista session B (8196 / 8809) ; plantas_platano 100_metros 2633 / 2896 ; jeunes bananiers dji_0544 118 / 137 (scripts/mesurer_fourchette_v3.py)
  # Test (une fois) : rappel 0,78 en plantation dense neuve (banano), 0,58 en dense (segmento est), 0,38 en plantation
  # tout juste plantée (très petits plants), 0,19 en agroforesterie (CG) : ces situations sont sous-comptées au-delà de la fourchette
  # Aiguillage par résolution d'origine (16/11, accord de Corentin) : une orthomosaïque dont le pixel d'origine dépasse
  # 7,5 cm passe au spécialiste basse résolution c16_a (départ v5, distillé du v5, appris sur images dégradées de 7 à 15 cm).
  # Règles : docs/journee_2026-11-16/avenant_c16_aiguillage_resolution.md, avenant_c16_juges.md, avenant_c16_installation.md.
  # Résultats : out/comptage/jour_1611/ (finalistes.md, juges_c16_a.md, installation.md). Juges dégradés à 11 cm, lus une fois :
  # F1 moyen (segmento est, CG, banano_dense) 0,519 contre 0,457 pour le v5 dégradé ; test_negatifs 0,30 %.
  # Limites : à basse résolution, l'agroforesterie dense (CG) reste presque invisible pour les deux réseaux (14 mères sur 290
  # pour c16_a à 11 cm) ; seuil de 7,5 cm fixé avant les mesures (aucune mesure entre 5 et 8 cm). À 7,5 cm ou moins : v5 inchangé.
  # Supprimer ce bloc rend le comportement d'avant (v5 partout).
  aiguillage_resolution:
    seuil_aiguillage_cm: 7.5
    modele: modeles/centres_5cm_c16_a.onnx
    seuil: 0.35              # règle 4.1 de l'avenant c16 (réglage dégradé à 11 cm, val_negatifs < 1 % à 8, 11 et 14 cm)
    coefficient_bas: 0.87    # fourchette (protocole v5, 7 bis) à 8, 11 et 14 cm par la lecture de la chaîne : plus petit, jeunes dji_0544 à 8 cm (118 / 135)
    coefficient_haut: 1.25   # plus grand : MM1-MM2 mères à 14 cm (69 / 55) ; rééchantillonnage : celui de la chaîne (average), retenu par R1
  # Détecteur de centres v4 (comparaison) : modele: modeles/centres_5cm_v4.onnx, coefficients 0.82 et 1.02
  # Détecteur de centres v3 (comparaison) : modele: modeles/centres_5cm_v3.onnx, coefficients 0.85 et 0.95
  # Détecteur de centres v2 (comparaison) : modele: modeles/centres_5cm_v2.onnx, coefficients 0.80 et 1.33
  # Détecteur de centres v1 (comparaison) : modele: modeles/centres_5cm.onnx, coefficients 0.93 et 1.21
  # Ancien détecteur à boîtes (comparaison) : modele: modeles/bananiers_deepforest_dense_v2.ckpt, seuil_score: 0.5, resolution_cm: 8
